name: RC3444 Full Swarm Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-swarm:
    name: Verify RC3444 Full Swarm
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify core files
        shell: bash
        run: |
          set -euo pipefail

          test -f rc3444-watch.json
          test -f rc3444-agents.json

          echo "CORE RC3444 FILES: FOUND"

      - name: Validate RC3444 JSON
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "rc3444-watch.json"
            "rc3444-agents.json"
            "rc3444-providers.json"
            "rc3444-audit-schema.json"
            "rc3444-offline-registry.json"
            "world-doomsday-clock.json"
            "world-clock-apk.json"
            "apk-ai-swarm-registry.json"
          )

          FOUND=0

          for file in "${FILES[@]}"; do
            if [[ -f "$file" ]]; then
              python -m json.tool "$file" >/dev/null
              echo "VALID: $file"
              FOUND=$((FOUND + 1))
            else
              echo "NOT INSTALLED YET: $file"
            fi
          done

          echo "VALIDATED FILES: $FOUND"

      - name: Verify core security gates
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json

          def load(path):
              with open(path, encoding="utf-8") as f:
                  return json.load(f)

          watch = load("rc3444-watch.json")
          agents = load("rc3444-agents.json")

          assert watch["policy"]["read_only"] is True
          assert watch["policy"]["fail_closed"] is True

          assert agents["read_only"] is True
          assert agents["fail_closed"] is True

          print("CORE SECURITY GATES: PASS")
          PY

      - name: Verify optional configurations
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os

          def load(path):
              with open(path, encoding="utf-8") as f:
                  return json.load(f)

          if os.path.isfile("rc3444-providers.json"):
              p = load("rc3444-providers.json")
              assert p["fail_closed"] is True
              print("PROVIDERS: PASS")

          if os.path.isfile("rc3444-audit-schema.json"):
              a = load("rc3444-audit-schema.json")
              assert a["fail_closed"] is True
              print("AUDIT: PASS")

          if os.path.isfile("rc3444-offline-registry.json"):
              o = load("rc3444-offline-registry.json")
              assert o["fail_closed"] is True
              print("OFFLINE REGISTRY: PASS")

          if os.path.isfile("world-doomsday-clock.json"):
              c = load("world-doomsday-clock.json")
              assert c["security"]["fail_closed"] is True
              print("WORLD CLOCK: PASS")

          if os.path.isfile("world-clock-apk.json"):
              apk = load("world-clock-apk.json")
              assert apk["security"]["fail_closed"] is True

              expected = "2026-10-05T10:00:00-07:00"
              actual = apk["clock"]["zero_hour"]

              assert actual == expected, (
                  f"ZERO HOUR mismatch: {actual}"
              )

              print("APK CONFIG: PASS")
              print("ZERO HOUR: VERIFIED")

          if os.path.isfile("apk-ai-swarm-registry.json"):
              swarm = load("apk-ai-swarm-registry.json")

              assert (
                  swarm["execution"]["bounded_worker_pool"]
                  is True
              )

              assert (
                  swarm["execution"]["verification_required"]
                  is True
              )

              print("AI SWARM REGISTRY: PASS")
          PY

      - name: Full swarm receipt
        run: |
          echo "===================================="
          echo "RC3444 FULL SWARM"
          echo "CORE: PASS"
          echo "JSON VALIDATION: PASS"
          echo "SECURITY GATE: PASS"
          echo "OPTIONAL MODULES: CHECKED"
          echo "STATUS: GREEN"
          echo "===================================="
